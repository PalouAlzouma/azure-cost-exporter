# ==============================================================================
# Prometheus configuration — Azure Cost Exporter
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Azure Cost Exporter
  # Scrape interval aligned with SCRAPE_INTERVAL=300 in the exporter.
  # scrape_timeout must be below scrape_interval (30s < 300s).
  - job_name: "azure-cost-exporter"
    scrape_interval: 5m
    scrape_timeout: 30s
    static_configs:
      - targets: ["azure-cost-exporter:9101"]
