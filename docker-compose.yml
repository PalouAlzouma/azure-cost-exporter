# ==============================================================================
# Azure Cost Exporter — Docker Compose example
#
# This file shows how to run the exporter alongside Prometheus and Grafana.
# The exporter uses Managed Identity — it must run on an Azure VM with a
# system-assigned identity and the "Cost Management Reader" role assigned
# at the subscription scope.
#
# Usage :
#   docker compose up -d
#
# Metrics available at : http://localhost:9101/metrics
# Prometheus available at : http://localhost:9090
# Grafana available at    : http://localhost:3000
# ==============================================================================

services:
  azure-cost-exporter:
    build: .
    container_name: azure-cost-exporter
    restart: unless-stopped
    ports:
      - "9101:9101"
    environment:
      # Required — replace with your actual values
      SUBSCRIPTION_ID: "${SUBSCRIPTION_ID}"
      RESOURCE_GROUP: "${RESOURCE_GROUP}"
      ENVIRONMENT: "${ENVIRONMENT:-dev}"
      # Optional — scrape interval in seconds (default: 300)
      SCRAPE_INTERVAL: "${SCRAPE_INTERVAL:-300}"

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
